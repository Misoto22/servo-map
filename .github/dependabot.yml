# Keep the pinned reusable-workflow SHAs and third-party actions current.
#
# Dependabot rewrites both the 40-character SHA and the trailing `# vX.Y.Z`
# comment when they sit on the same line, which is why every `uses:` in this
# repository is written that way.
#
# The `chore` prefix keeps these pull requests out of the changelog: the fleet
# changelog-sections deliberately list only feat, fix, perf, revert, docs and
# refactor, so a chore commit never opens or moves a release pull request.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
